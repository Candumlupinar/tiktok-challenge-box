<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil | AI Social Shopping</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="logo">
            <i class="fas fa-shopping-bag fa-2x"></i>
            <span>AI Social Shopping</span>
        </div>
        <div class="nav-links">
            <a href="index.html" data-translate="nav.home">Ana Sayfa</a>
            <a href="index.html#features" data-translate="nav.features">Özellikler</a>
            <a href="index.html#products" data-translate="nav.products">Ürünler</a>
            <a href="index.html#about" data-translate="nav.about">Hakkımızda</a>
            <a href="index.html#contact" data-translate="nav.contact">İletişim</a>
            <a href="index.html#global" data-translate="nav.global">Global</a>
            <a href="index.html#experience" data-translate="nav.experience">Deneyim</a>
        </div>
        <div class="nav-buttons">
            <div class="user-menu">
                <button class="user-btn">
                    <i class="fas fa-user-circle"></i>
                    <span class="user-name">Kullanıcı</span>
                </button>
                <div class="user-dropdown">
                    <a href="#profile" class="active"><i class="fas fa-user"></i> Profil</a>
                    <a href="#settings"><i class="fas fa-cog"></i> Ayarlar</a>
                    <a href="#orders"><i class="fas fa-shopping-bag"></i> Siparişlerim</a>
                    <a href="#favorites"><i class="fas fa-heart"></i> Favorilerim</a>
                    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</a>
                </div>
            </div>
            <div class="language-selector">
                <button class="lang-btn active" data-lang="tr">TR</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-sidebar">
            <div class="profile-header">
                <div class="profile-avatar">
                    <i class="fas fa-user-circle fa-5x"></i>
                    <button class="change-avatar">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                <h2 class="profile-name">Kullanıcı Adı</h2>
                <p class="profile-email">kullanici@email.com</p>
            </div>
            <div class="profile-menu">
                <a href="#profile" class="active"><i class="fas fa-user"></i> Profil Bilgileri</a>
                <a href="#security"><i class="fas fa-shield-alt"></i> Güvenlik</a>
                <a href="#notifications"><i class="fas fa-bell"></i> Bildirimler</a>
                <a href="#preferences"><i class="fas fa-cog"></i> Tercihler</a>
            </div>
        </div>

        <div class="profile-content">
            <div class="profile-section active" id="profile-info">
                <h2>Profil Bilgileri</h2>
                <form id="profileForm" class="profile-form">
                    <div class="form-group">
                        <label>Ad Soyad</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>E-posta</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Telefon</label>
                        <input type="tel" id="phone">
                    </div>
                    <div class="form-group">
                        <label>Adres</label>
                        <textarea id="address"></textarea>
                    </div>
                    <button type="submit" class="save-btn">Değişiklikleri Kaydet</button>
                </form>
            </div>

            <div class="profile-section" id="security">
                <h2>Güvenlik Ayarları</h2>
                <form id="securityForm" class="profile-form">
                    <div class="form-group">
                        <label>Mevcut Şifre</label>
                        <input type="password" id="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Yeni Şifre</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Yeni Şifre Tekrar</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="save-btn">Şifreyi Güncelle</button>
                </form>
            </div>

            <div class="profile-section" id="notifications">
                <h2>Bildirim Ayarları</h2>
                <form id="notificationsForm" class="profile-form">
                    <div class="notification-option">
                        <label>
                            <input type="checkbox" id="emailNotif">
                            E-posta Bildirimleri
                        </label>
                    </div>
                    <div class="notification-option">
                        <label>
                            <input type="checkbox" id="smsNotif">
                            SMS Bildirimleri
                        </label>
                    </div>
                    <div class="notification-option">
                        <label>
                            <input type="checkbox" id="pushNotif">
                            Push Bildirimleri
                        </label>
                    </div>
                    <button type="submit" class="save-btn">Tercihleri Kaydet</button>
                </form>
            </div>

            <div class="profile-section" id="preferences">
                <h2>Tercihler</h2>
                <form id="preferencesForm" class="profile-form">
                    <div class="form-group">
                        <label>Dil</label>
                        <select id="language">
                            <option value="tr">Türkçe</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Para Birimi</label>
                        <select id="currency">
                            <option value="TRY">TRY</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tema</label>
                        <select id="theme">
                            <option value="light">Açık</option>
                            <option value="dark">Koyu</option>
                            <option value="system">Sistem</option>
                        </select>
                    </div>
                    <button type="submit" class="save-btn">Tercihleri Kaydet</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="profile.js"></script>
</body>
</html>
